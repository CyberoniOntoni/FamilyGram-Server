name: Build and Push Docker Images

# Builds the six .NET services this fork has source for, plus the Python
# verification bot, and publishes them to GHCR. session-server and file-server
# are not part of this repo (see docker/compose/docker-compose.yml) and keep
# pulling from the upstream MyTelegram registry instead.

on:
  push:
    branches: [dev]
    tags: ["v*.*.*"]
    paths:
      - "source/**"
      - "build/docker/**"
      - "bot/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [dev]
    paths:
      - "source/**"
      - "build/docker/**"
      - "bot/**"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: mytelegram-messenger-command-server
            dockerfile: build/docker/Dockerfile-mytelegram-messenger-command-server
            context: source
          - name: mytelegram-messenger-query-server
            dockerfile: build/docker/Dockerfile-mytelegram-messenger-query-server
            context: source
          - name: mytelegram-gateway-server
            dockerfile: build/docker/Dockerfile-mytelegram-gateway-server
            context: source
          - name: mytelegram-auth-server
            dockerfile: build/docker/Dockerfile-mytelegram-auth-server
            context: source
          - name: mytelegram-sms-sender
            dockerfile: build/docker/Dockerfile-mytelegram-sms-sender
            context: source
          - name: mytelegram-data-seeder
            dockerfile: build/docker/Dockerfile-mytelegram-data-seeder
            context: source
          - name: testgram-bot
            dockerfile: bot/Dockerfile
            context: bot

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(head -n 1 build/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service.context }}
          file: ./${{ matrix.service.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_CONFIGURATION=Release
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
